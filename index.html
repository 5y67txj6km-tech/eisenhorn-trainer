<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Eisenhorn Trainer</title>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">

<!-- Theme colors -->
<meta name="theme-color" content="#312e81" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

<!-- iOS PWA setup -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eisenhorn">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f8fafc;
    --bg-secondary: #f1f5f9;
    --card-bg: #ffffff;
    --text-color: #1e293b;
    --text-color-secondary: #64748b;
    --border-color: #e2e8f0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --card-bg: #1e293b;
      --text-color: #f1f5f9;
      --text-color-secondary: #94a3b8;
      --border-color: #334155;
    }
  }

  * { -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-color);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    /* Safe-area for iPhone notch */
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: contain;
  }

  body {
    /* prevent rubber-band white background on iOS */
    background:
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%)
      var(--bg);
  }

  #root {
    min-height: 100vh;
    min-height: 100dvh;
  }

  @keyframes spin {
    from { transform: rotate(0); }
    to { transform: rotate(360deg); }
  }

  button { font-family: inherit; }
  input, textarea { font-family: inherit; -webkit-appearance: none; appearance: none; }

  /* prevent iOS zoom on focus */
  input, textarea, select { font-size: 16px !important; }
</style>
</head>
<body>
<div id="root"></div>
